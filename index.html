<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hello</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #fafafa;
    overflow: hidden;
  }
  #instructions {
    position: fixed;
    top: 14px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: sans-serif;
    font-size: 13px;
    color: #999;
    letter-spacing: 0.05em;
    user-select: none;
    pointer-events: none;
  }
  #rat {
    position: fixed;
    top: 0;
    left: 0;
    font-size: 30px;
    line-height: 1;
    user-select: none;
    pointer-events: none;
    will-change: transform;
  }
  #trail {
    position: fixed;
    top: 0;
    left: 0;
    font-family: "Courier New", Courier, monospace;
    font-size: 15px;
    color: #333;
    white-space: nowrap;
    user-select: none;
    pointer-events: none;
    will-change: transform;
  }
</style>
</head>
<body>
<div id="instructions">catch him</div>
<div id="rat">🐀</div>
<div id="trail"></div>
<script>
  const SENTENCE = "Hello, my name is Hannah.";
  const rat = document.getElementById("rat");
  const trail = document.getElementById("trail");

  let w = window.innerWidth, h = window.innerHeight;
  window.addEventListener("resize", () => { w = window.innerWidth; h = window.innerHeight; });

  // --- rat wandering / fleeing ---
  let ratX = Math.random() * w, ratY = Math.random() * h;
  let vx = 0, vy = 0;
  const WANDER_SPEED = 90;   // px/sec
  const FLEE_SPEED = 260;    // px/sec
  const FLEE_RADIUS = 130;   // px
  const MARGIN = 20;

  function newWanderDirection() {
    const angle = Math.random() * Math.PI * 2;
    vx = Math.cos(angle) * WANDER_SPEED;
    vy = Math.sin(angle) * WANDER_SPEED;
  }
  newWanderDirection();
  setInterval(newWanderDirection, 900 + Math.random() * 900);

  // --- pointer tracking ---
  let mouseX = w / 2, mouseY = h / 2;
  let hasMouse = false;
  let lastMoveX = mouseX, lastMoveY = mouseY, lastMoveTime = performance.now();
  let revealLength = 0;
  const REVEAL_GAIN = 0.0022;
  const REVEAL_DECAY = 7; // chars per second

  window.addEventListener("pointermove", (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    hasMouse = true;
    const now = performance.now();
    const dt = Math.max(now - lastMoveTime, 1);
    const dist = Math.hypot(mouseX - lastMoveX, mouseY - lastMoveY);
    const speed = (dist / dt) * 1000; // px/sec
    revealLength = Math.min(SENTENCE.length, revealLength + speed * REVEAL_GAIN);
    lastMoveX = mouseX;
    lastMoveY = mouseY;
    lastMoveTime = now;
  });

  let trailX = mouseX, trailY = mouseY;

  let lastTime = performance.now();
  function frame(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    // flee if pointer is near
    if (hasMouse) {
      const dx = ratX - mouseX, dy = ratY - mouseY;
      const dist = Math.hypot(dx, dy);
      if (dist < FLEE_RADIUS && dist > 0.01) {
        vx = (dx / dist) * FLEE_SPEED;
        vy = (dy / dist) * FLEE_SPEED;
      }
    }

    ratX += vx * dt;
    ratY += vy * dt;

    if (ratX < MARGIN) { ratX = MARGIN; vx = Math.abs(vx); }
    if (ratX > w - MARGIN) { ratX = w - MARGIN; vx = -Math.abs(vx); }
    if (ratY < MARGIN) { ratY = MARGIN; vy = Math.abs(vy); }
    if (ratY > h - MARGIN) { ratY = h - MARGIN; vy = -Math.abs(vy); }

    const facingLeft = vx <= 0;
    rat.style.transform = `translate(${ratX - 15}px, ${ratY - 15}px) scaleX(${facingLeft ? 1 : -1})`;

    // reveal text decays over time, grows on fast pointer moves
    revealLength = Math.max(0, revealLength - REVEAL_DECAY * dt);

    // trailing text lags behind the pointer
    trailX += (mouseX - trailX) * 0.15;
    trailY += (mouseY - trailY) * 0.15;
    trail.style.transform = `translate(${trailX + 16}px, ${trailY + 16}px)`;
    trail.textContent = SENTENCE.slice(0, Math.round(revealLength));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
