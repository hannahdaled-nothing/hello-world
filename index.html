<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hello</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #050505;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1.sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .board {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px 22px;
    max-width: 900px;
    padding: 24px;
  }
  .word {
    display: flex;
    gap: 6px;
  }
  .tile {
    width: clamp(24px, 6vw, 46px);
    height: clamp(36px, 9vw, 68px);
    perspective: 300px;
  }
  .tile-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform: rotateX(0deg);
  }
  .tile-face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(to bottom, #1c1c1c 49.5%, #101010 50.5%);
    color: #ffb100;
    font-family: "Courier New", Courier, monospace;
    font-weight: 700;
    font-size: clamp(16px, 4.5vw, 34px);
    border-radius: 3px;
    backface-visibility: hidden;
    box-shadow: inset 0 0 0 1px #000, 0 2px 4px rgba(0,0,0,.6);
  }
  .tile-face.back {
    transform: rotateX(180deg);
  }
</style>
</head>
<body>
<h1 class="sr-only">Hello, my name is Hannah Daled</h1>
<div class="board" id="board" aria-hidden="true"></div>
<script>
  const TEXT = "HELLO, MY NAME IS HANNAH DALED";
  const CHARS = " ABCDEFGHIJKLMNOPQRSTUVWXYZ,.!?";
  const FLIP_MS = 130;
  const GAP_MS = 40;

  const board = document.getElementById("board");
  const words = TEXT.split(" ");

  function randChar() {
    return CHARS[Math.floor(Math.random() * CHARS.length)];
  }

  function makeTile() {
    const tile = document.createElement("div");
    tile.className = "tile";
    const inner = document.createElement("div");
    inner.className = "tile-inner";
    const front = document.createElement("div");
    front.className = "tile-face front";
    const back = document.createElement("div");
    back.className = "tile-face back";
    inner.append(front, back);
    tile.append(inner);
    return { tile, inner, front, back };
  }

  function flipOnce(refs, nextChar, onDone) {
    refs.back.textContent = nextChar;
    refs.inner.style.transition = `transform ${FLIP_MS}ms ease-in`;
    requestAnimationFrame(() => {
      refs.inner.style.transform = "rotateX(-180deg)";
    });
    setTimeout(() => {
      refs.inner.style.transition = "none";
      refs.inner.style.transform = "rotateX(0deg)";
      refs.front.textContent = nextChar;
      refs.inner.offsetHeight;
      onDone();
    }, FLIP_MS);
  }

  function runTile(refs, target, stopAt) {
    if (performance.now() >= stopAt) {
      flipOnce(refs, target, () => {});
      return;
    }
    flipOnce(refs, randChar(), () => {
      setTimeout(() => runTile(refs, target, stopAt), GAP_MS);
    });
  }

  let index = 0;
  words.forEach(word => {
    const wordEl = document.createElement("div");
    wordEl.className = "word";
    [...word].forEach(target => {
      const refs = makeTile();
      refs.front.textContent = " ";
      refs.back.textContent = " ";
      wordEl.append(refs.tile);

      const startDelay = index * 25 + Math.random() * 150;
      const stopAt = performance.now() + 1400 + index * 40 + Math.random() * 900;
      setTimeout(() => runTile(refs, target, stopAt), startDelay);
      index++;
    });
    board.append(wordEl);
  });
</script>
</body>
</html>
