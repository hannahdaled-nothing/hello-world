<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hello</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #fafafa;
    overflow: hidden;
    cursor: none;
  }
  #instructions {
    position: fixed;
    top: 14px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: sans-serif;
    font-size: 13px;
    color: #999;
    letter-spacing: 0.05em;
    user-select: none;
    pointer-events: none;
  }
  .critter {
    position: fixed;
    top: 0;
    left: 0;
    line-height: 1;
    user-select: none;
    pointer-events: none;
    will-change: transform;
  }
  #caterpillar {
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    user-select: none;
    pointer-events: none;
    will-change: transform;
  }
  #caterpillar .seg {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-left: -3px;
    box-shadow: inset 0 -1px 1px rgba(0,0,0,0.15);
  }
  #caterpillar .seg:first-child { margin-left: 0; }
  #caterpillar .head {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #7bc043;
    position: relative;
    box-shadow: inset 0 -1px 1px rgba(0,0,0,0.15);
  }
  #caterpillar .head::before,
  #caterpillar .head::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 2px;
    background: #222;
    border-radius: 50%;
    top: 3px;
  }
  #caterpillar .head::before { left: 2px; }
  #caterpillar .head::after { left: 6px; }
  #caterpillar .antenna {
    position: absolute;
    width: 1.5px;
    height: 5px;
    background: #7bc043;
    top: -4px;
  }
  #caterpillar .antenna.l { left: 2px; transform: rotate(-20deg); transform-origin: bottom; }
  #caterpillar .antenna.r { left: 7px; transform: rotate(20deg); transform-origin: bottom; }
  .static-decor {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    user-select: none;
  }
  .grass {
    width: 20px;
    height: 20px;
  }
  .grass .blade {
    position: absolute;
    bottom: 0;
    width: 3px;
    border-radius: 4px 4px 0 0;
    background: #6aa84f;
    transform: rotate(var(--base));
    transform-origin: bottom center;
  }
  .grass.wave .blade {
    animation: sway 2.4s ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes sway {
    0%, 100% { transform: rotate(var(--base)); }
    50% { transform: rotate(calc(var(--base) + 10deg)); }
  }
  .flower {
    width: 16px;
    height: 16px;
  }
  .flower .petal {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    top: 5px;
    left: 5px;
    transform-origin: center;
  }
  .flower .center {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #f4c542;
    top: 5.5px;
    left: 5.5px;
    z-index: 1;
  }
  .bear {
    font-size: 26px;
    line-height: 1;
  }
  #caught {
    position: fixed;
    top: 0;
    left: 0;
    font-family: "Courier New", Courier, monospace;
    font-size: 16px;
    color: #333;
    white-space: nowrap;
    user-select: none;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #net {
    position: fixed;
    top: 0;
    left: 0;
    width: 64px;
    height: 82px;
    user-select: none;
    pointer-events: none;
    will-change: transform;
    overflow: visible;
  }
  .critter, .generated-critter {
    transition: opacity 0.3s ease;
  }
  .generated-critter {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    user-select: none;
    will-change: transform;
  }
  .generated-critter .body {
    position: relative;
  }
  .generated-critter .eye {
    position: absolute;
    width: 30%;
    height: 30%;
    background: #fff;
    border-radius: 50%;
    top: 20%;
  }
  .generated-critter .eye::after {
    content: "";
    position: absolute;
    width: 45%;
    height: 45%;
    background: #222;
    border-radius: 50%;
    top: 27%;
    left: 27%;
  }
  .generated-critter .spike {
    position: absolute;
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    top: -6px;
  }
  #creature-panel {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 20;
    font-family: sans-serif;
    cursor: auto;
  }
  #creature-toggle {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid #ddd;
    background: #fff;
    font-size: 20px;
    line-height: 1;
    color: #555;
    cursor: pointer;
    box-shadow: 0 1px 5px rgba(0,0,0,0.18);
  }
  #describe-form, #name-form {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 6px 8px 6px 14px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.18);
  }
  #describe-form.hidden, #name-form.hidden {
    display: none;
  }
  #creature-input, #creature-name-input {
    border: none;
    outline: none;
    font-size: 13px;
    width: 170px;
    cursor: text;
  }
  #creature-name-input {
    width: 110px;
  }
  #describe-form button[type="submit"], #name-form button[type="submit"] {
    border: none;
    background: #333;
    color: #fff;
    border-radius: 14px;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  #creature-preview {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    font-size: 20px;
    line-height: 1;
  }
  #creature-preview .preview-body {
    border-radius: inherit;
  }
</style>
</head>
<body>
<div id="instructions">catch the caterpillar</div>
<div id="caught">Hello, I am Hannah.</div>
<div id="net">
  <svg viewBox="0 0 64 82" width="64" height="82">
    <defs>
      <pattern id="meshPattern" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#999" stroke-width="1"/>
      </pattern>
      <clipPath id="bagClip">
        <path d="M8,20 Q4,46 24,52 Q44,46 40,20 Z"/>
      </clipPath>
    </defs>
    <!-- handle -->
    <line x1="32" y1="30" x2="56" y2="78" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/>
    <!-- mesh net bag -->
    <path d="M8,20 Q4,46 24,52 Q44,46 40,20 Z" fill="rgba(240,240,240,0.55)"/>
    <g clip-path="url(#bagClip)">
      <rect x="0" y="14" width="48" height="42" fill="url(#meshPattern)"/>
    </g>
    <path d="M8,20 Q4,46 24,52 Q44,46 40,20" fill="none" stroke="#aaa" stroke-width="1"/>
    <!-- hoop -->
    <circle cx="24" cy="20" r="17" fill="none" stroke="#555" stroke-width="4"/>
  </svg>
</div>
<div id="creature-panel">
  <button id="creature-toggle" type="button" title="Add a creature">+</button>
  <form id="describe-form" class="hidden">
    <input id="creature-input" type="text" placeholder="describe a creature..." maxlength="40" autocomplete="off">
    <button type="submit">Generate</button>
  </form>
  <form id="name-form" class="hidden">
    <span id="creature-preview"></span>
    <input id="creature-name-input" type="text" placeholder="name it..." maxlength="20" autocomplete="off">
    <button type="submit">Add</button>
  </form>
</div>
<script>
  let w = window.innerWidth, h = window.innerHeight;
  window.addEventListener("resize", () => { w = window.innerWidth; h = window.innerHeight; });

  const net = document.getElementById("net");
  const caughtText = document.getElementById("caught");

  let mouseX = w / 2, mouseY = h / 2;
  let hasMouse = false;
  window.addEventListener("pointermove", (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    hasMouse = true;
  });

  const critters = [];

  function addCritter(state) {
    function newDir() {
      const angle = Math.random() * Math.PI * 2;
      state.vx = Math.cos(angle) * state.speed;
      state.vy = Math.sin(angle) * state.speed;
    }
    state.newDir = newDir;
    newDir();
    state.dirTimer = setInterval(newDir, 700 + Math.random() * 1300);
    critters.push(state);
  }

  // --- static decorations: grass, flowers, sitting bears ---
  const decorLayer = document.createElement("div");
  document.body.insertBefore(decorLayer, document.body.firstChild);

  function randPos(el, marginTop) {
    const x = Math.random() * (w - 30) + 5;
    const y = (marginTop || 50) + Math.random() * (h - (marginTop || 50) - 20);
    el.style.transform = `translate(${x}px, ${y}px)`;
  }

  for (let i = 0; i < 14; i++) {
    const grass = document.createElement("div");
    grass.className = "static-decor grass" + (Math.random() < 0.6 ? " wave" : "");
    for (let b = 0; b < 3; b++) {
      const blade = document.createElement("span");
      blade.className = "blade";
      const base = -18 + b * 18 + (Math.random() * 8 - 4);
      blade.style.setProperty("--base", base + "deg");
      blade.style.setProperty("--delay", (Math.random() * 1.5) + "s");
      blade.style.left = (2 + b * 6) + "px";
      blade.style.height = (12 + Math.random() * 8) + "px";
      grass.appendChild(blade);
    }
    randPos(grass);
    decorLayer.appendChild(grass);
  }

  const petalColors = ["#f28fb2", "#ffffff", "#c9a6f0", "#f6a04d", "#f2665e"];
  for (let i = 0; i < 8; i++) {
    const flower = document.createElement("div");
    flower.className = "static-decor flower";
    const color = petalColors[Math.floor(Math.random() * petalColors.length)];
    for (let p = 0; p < 5; p++) {
      const petal = document.createElement("span");
      petal.className = "petal";
      petal.style.background = color;
      petal.style.transform = `rotate(${p * 72}deg) translateY(-6px)`;
      flower.appendChild(petal);
    }
    const center = document.createElement("span");
    center.className = "center";
    flower.appendChild(center);
    randPos(flower);
    decorLayer.appendChild(flower);
  }

  ["🐻", "🐻", "🐨"].forEach((emoji) => {
    const bear = document.createElement("div");
    bear.className = "static-decor bear";
    bear.textContent = emoji;
    randPos(bear, 70);
    decorLayer.appendChild(bear);
  });

  // --- decorative critters: wander only ---
  function spawnEmojiCritter(emoji, opts = {}) {
    const el = document.createElement("div");
    el.className = "critter";
    el.textContent = emoji;
    const size = 20 + Math.random() * 10;
    el.style.fontSize = size + "px";
    el.style.opacity = 0;
    document.body.appendChild(el);
    addCritter({
      el,
      x: opts.dropX ?? Math.random() * w,
      y: opts.dropY ?? Math.random() * h,
      vx: 0, vy: 0,
      speed: 50 + Math.random() * 90,
      halfSize: size / 2,
      flee: false,
      catchable: opts.catchable ?? false,
      catchMessage: opts.catchMessage,
    });
    requestAnimationFrame(() => { el.style.opacity = 1; });
  }

  const ANIMALS = ["🐀", "🐁", "🐇", "🐿️", "🦔", "🐦", "🐤", "🐝", "🐞", "🦋", "🦋", "🐜", "🕷️", "🪲", "🦗"];
  ANIMALS.forEach((emoji) => spawnEmojiCritter(emoji));

  // --- user-generated creatures ---
  const KEYWORD_EMOJI = {
    cat: "🐱", kitten: "🐱", dog: "🐶", puppy: "🐶", fox: "🦊", wolf: "🐺",
    bear: "🐻", panda: "🐼", koala: "🐨", lion: "🦁", tiger: "🐯", cow: "🐮",
    pig: "🐷", horse: "🐴", unicorn: "🦄", zebra: "🦓", deer: "🦌", camel: "🐫",
    elephant: "🐘", rhino: "🦏", hippo: "🦛", monkey: "🐵", gorilla: "🦍",
    sheep: "🐑", goat: "🐐", chicken: "🐔", rooster: "🐓", turkey: "🦃",
    penguin: "🐧", owl: "🦉", eagle: "🦅", parrot: "🦜", flamingo: "🦩",
    duck: "🦆", swan: "🦢", peacock: "🦚", frog: "🐸", turtle: "🐢",
    lizard: "🦎", snake: "🐍", dragon: "🐉", dinosaur: "🦖", crocodile: "🐊",
    fish: "🐟", whale: "🐳", dolphin: "🐬", shark: "🦈", octopus: "🐙",
    crab: "🦀", lobster: "🦞", shrimp: "🦐", snail: "🐌", worm: "🪱",
    spider: "🕷️", scorpion: "🦂", ant: "🐜", bee: "🐝", beetle: "🪲",
    cricket: "🦗", ladybug: "🐞", butterfly: "🦋", caterpillar: "🐛",
    mosquito: "🦟", squid: "🦑", squirrel: "🐿️", hedgehog: "🦔",
    rabbit: "🐇", bunny: "🐇", mouse: "🐭", rat: "🐀", hamster: "🐹",
    bat: "🦇", raccoon: "🦝", otter: "🦦", skunk: "🦨", kangaroo: "🦘",
    alien: "👽", robot: "🤖", ghost: "👻", dragonfly: "🪰",
  };

  function hashString(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
      h = (Math.imul(h, 31) + str.charCodeAt(i)) >>> 0;
    }
    return h;
  }

  const CREATURE_PALETTE = ["#e63946", "#f4a261", "#e9c46a", "#2a9d8f", "#457b9d", "#8e7cc3", "#ff6f91", "#43aa8b"];

  function resolveCreature(desc) {
    const lower = desc.toLowerCase();
    const match = Object.keys(KEYWORD_EMOJI).find((word) => lower.includes(word));
    if (match) {
      return { type: "emoji", emoji: KEYWORD_EMOJI[match], desc };
    }
    const h = hashString(lower);
    const shapeRoll = (h >> 4) % 3;
    return {
      type: "generated",
      desc,
      size: 20 + (h % 12),
      color: CREATURE_PALETTE[h % CREATURE_PALETTE.length],
      borderRadius: shapeRoll === 0 ? "50%" : shapeRoll === 1 ? "30%" : "10%",
      eyeCount: 1 + ((h >> 6) % 3),
      hasSpikes: (h >> 8) % 2 === 0,
    };
  }

  function buildGeneratedBody(d) {
    const body = document.createElement("div");
    body.className = "body";
    body.style.width = d.size + "px";
    body.style.height = d.size + "px";
    body.style.background = d.color;
    body.style.borderRadius = d.borderRadius;

    if (d.hasSpikes) {
      const spikeCount = 3;
      for (let i = 0; i < spikeCount; i++) {
        const spike = document.createElement("div");
        spike.className = "spike";
        spike.style.borderBottom = `6px solid ${d.color}`;
        spike.style.left = (d.size * (i + 1)) / (spikeCount + 1) - 4 + "px";
        body.appendChild(spike);
      }
    }

    for (let i = 0; i < d.eyeCount; i++) {
      const eye = document.createElement("div");
      eye.className = "eye";
      eye.style.left = (d.size * (i + 1)) / (d.eyeCount + 1) - d.size * 0.15 + "px";
      body.appendChild(eye);
    }
    return body;
  }

  function spawnGeneratedCritter(d, opts = {}) {
    const el = document.createElement("div");
    el.className = "generated-critter";
    el.style.opacity = 0;
    el.title = d.desc;
    el.appendChild(buildGeneratedBody(d));
    document.body.appendChild(el);

    addCritter({
      el,
      x: opts.dropX ?? Math.random() * w,
      y: opts.dropY ?? Math.random() * h,
      vx: 0, vy: 0,
      speed: 40 + Math.random() * 80,
      halfSize: d.size / 2,
      flee: false,
      catchable: opts.catchable ?? false,
      catchMessage: opts.catchMessage,
    });
    requestAnimationFrame(() => { el.style.opacity = 1; });
  }

  function renderPreview(descriptor) {
    const preview = document.getElementById("creature-preview");
    preview.innerHTML = "";
    if (descriptor.type === "emoji") {
      preview.textContent = descriptor.emoji;
    } else {
      preview.appendChild(buildGeneratedBody(descriptor));
    }
  }

  function finalizeCreature(descriptor, name, dropX, dropY) {
    const opts = { dropX, dropY, catchable: true, catchMessage: `Hi I am ${name}` };
    if (descriptor.type === "emoji") {
      spawnEmojiCritter(descriptor.emoji, opts);
    } else {
      spawnGeneratedCritter(descriptor, opts);
    }
  }

  const creatureToggle = document.getElementById("creature-toggle");
  const describeForm = document.getElementById("describe-form");
  const creatureInput = document.getElementById("creature-input");
  const nameForm = document.getElementById("name-form");
  const nameInput = document.getElementById("creature-name-input");
  let pendingCreature = null;

  creatureToggle.addEventListener("click", () => {
    creatureToggle.style.display = "none";
    describeForm.classList.remove("hidden");
    creatureInput.focus();
  });

  function resetCreaturePanel() {
    describeForm.classList.add("hidden");
    nameForm.classList.add("hidden");
    creatureToggle.style.display = "";
    creatureInput.value = "";
    nameInput.value = "";
    pendingCreature = null;
  }

  creatureInput.addEventListener("keydown", (e) => {
    if (e.key === "Escape") resetCreaturePanel();
  });
  nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Escape") resetCreaturePanel();
  });

  describeForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const desc = creatureInput.value.trim();
    if (!desc) return;
    pendingCreature = resolveCreature(desc);
    renderPreview(pendingCreature);
    describeForm.classList.add("hidden");
    nameForm.classList.remove("hidden");
    nameInput.focus();
  });

  nameForm.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!pendingCreature) { resetCreaturePanel(); return; }
    const name = nameInput.value.trim() || pendingCreature.desc;
    finalizeCreature(pendingCreature, name, Math.random() * w, Math.random() * h);
    resetCreaturePanel();
  });

  // --- caterpillar: the one you're after ---
  const colors = ["#e63946", "#f4a261", "#e9c46a", "#2a9d8f", "#264653", "#8e7cc3"];
  const caterpillarEl = document.createElement("div");
  caterpillarEl.id = "caterpillar";
  const head = document.createElement("div");
  head.className = "head";
  const antL = document.createElement("div");
  antL.className = "antenna l";
  const antR = document.createElement("div");
  antR.className = "antenna r";
  head.append(antL, antR);
  caterpillarEl.append(head);
  colors.forEach((c) => {
    const seg = document.createElement("div");
    seg.className = "seg";
    seg.style.background = c;
    caterpillarEl.append(seg);
  });
  document.body.appendChild(caterpillarEl);

  const caterpillar = {
    el: caterpillarEl,
    x: Math.random() * w,
    y: Math.random() * h,
    vx: 0, vy: 0,
    speed: 75,
    halfSize: 10,
    flee: true,
    fleeSpeed: 230,
    fleeRadius: 120,
    catchable: true,
    catchMessage: "Hello, I am Hannah.",
  };
  addCritter(caterpillar);

  const CATCH_RADIUS = 24;
  const MARGIN = 20;
  const HOLD_MS = 1800;
  const HELD_OFFSET_X = 0;
  const HELD_OFFSET_Y = 20;
  let caught = false;
  let caughtCritter = null;

  function catchCritter(critter) {
    caught = true;
    caughtCritter = critter;
    clearInterval(critter.dirTimer);
    critter.vx = 0;
    critter.vy = 0;
    caughtText.textContent = critter.catchMessage || "";
    caughtText.style.opacity = 1;

    setTimeout(() => {
      caughtText.style.opacity = 0;
      critter.el.style.opacity = 0;
      critter.x = Math.random() * w;
      critter.y = Math.random() * h;
      critter.el.style.opacity = 1;
      critter.dirTimer = setInterval(critter.newDir, 700 + Math.random() * 1300);
      critter.newDir();
      caught = false;
      caughtCritter = null;
    }, HOLD_MS);
  }

  let lastTime = performance.now();
  function frame(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    critters.forEach((c) => {
      if (caught && c === caughtCritter) {
        c.x = mouseX + HELD_OFFSET_X;
        c.y = mouseY + HELD_OFFSET_Y;
        caughtText.style.transform = `translate(${c.x + 20}px, ${c.y}px)`;
      } else {
        if (c.flee && hasMouse) {
          const dx = c.x - mouseX, dy = c.y - mouseY;
          const dist = Math.hypot(dx, dy);
          if (dist < c.fleeRadius && dist > 0.01) {
            c.vx = (dx / dist) * c.fleeSpeed;
            c.vy = (dy / dist) * c.fleeSpeed;
          }
        }

        c.x += c.vx * dt;
        c.y += c.vy * dt;

        const m = c.halfSize + MARGIN;
        if (c.x < m) { c.x = m; c.vx = Math.abs(c.vx); }
        if (c.x > w - m) { c.x = w - m; c.vx = -Math.abs(c.vx); }
        if (c.y < m) { c.y = m; c.vy = Math.abs(c.vy); }
        if (c.y > h - m) { c.y = h - m; c.vy = -Math.abs(c.vy); }

        if (c.catchable && !caught && hasMouse && Math.hypot(c.x - mouseX, c.y - mouseY) < CATCH_RADIUS) {
          catchCritter(c);
        }
      }

      const facingLeft = c.vx <= 0;
      c.el.style.transform = `translate(${c.x - c.halfSize}px, ${c.y - c.halfSize}px) scaleX(${facingLeft ? 1 : -1})`;
    });

    if (hasMouse) {
      net.style.transform = `translate(${mouseX - 24}px, ${mouseY - 20}px)`;
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
